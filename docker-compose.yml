version: "3.9"

services:
  odxt-or-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odxt-or-backend
    ports:
      - "8001:8001"
    volumes:
      # Persist database files and generated data across container restarts
      - odxt_data:/app/data
      - odxt_db:/app/database
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  odxt_data:
  odxt_db:
